<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Docs · RedStar Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e11d48' d='M32 4l6.95 14.09L54 20.36 42.98 31.1 45.24 46 32 38.73 18.76 46 21.02 31.1 10 20.36l15.05-2.27z'/%3E%3C/svg%3E">
</head>
<body class="purple-bg">
    <main class="page">
        <header class="header">
            <div class="logo" aria-label="RedStar Club logo" role="img">
                <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path fill="#e11d48" d="M32 4l6.95 14.09L54 20.36 42.98 31.1 45.24 46 32 38.73 18.76 46 21.02 31.1 10 20.36l15.05-2.27z"/>
                </svg>
                <span class="club-name">RedStar Club · Docs</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px">
                <button class="login-btn login-red" onclick="window.location.href='index.html'" aria-label="Start using RedStar">Start using RedStar</button>
                <button class="register-btn" onclick="window.location.href='login.html'" aria-label="Log in">Log in</button>
            </div>
        </header>

        <section class="hero" aria-labelledby="docs-title">
            <h1 id="docs-title">About us</h1>
            <p class="subtitle">This is a club called RedStar. We made this page using HTML, CSS, and JavaScript using the AI. Join us!</p>
            <div style="margin-top:16px">
                <img src="https://source.unsplash.com/random/1200x600" alt="Image of the club">
            </div>
        </section>
    </main>

    <footer class="footer" style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
            <div class="logo" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#e11d48" d="M12 2l2.6 5.28L20 8.18l-4.1 3.92L16.5 18 12 15.27 7.5 18l.6-5.9L4 8.18l5.4-.9z"/></svg>
            </div>
            <small>© <span id="year"></span> RedStar Club</small>
        </div>
    </footer>

    <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
