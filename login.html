<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Log in · RedStar Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .guest-login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
            gap: 10px;
        }
        
        .g_id_signin {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .guest-login-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        
        .guest-login-btn:hover {
            background: #4b5563;
        }

        .google-login-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: background-color 0.2s ease;
            margin-bottom: 10px;
        }

        .google-login-btn:hover {
            background: #16a34a;
        }
        
        .guest-icon, .google-icon {
            width: 18px;
            height: 18px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--muted);
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .divider span {
            padding: 0 16px;
        }
    </style>
</head>
<body>
    <div class="card" role="region" aria-labelledby="title">
        <div class="header">
            <div class="logo" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#e11d48" d="M12 2l2.6 5.28L20 8.18l-4.1 3.92L16.5 18 12 15.27 7.5 18l.6-5.9L4 8.18l5.4-.9z"/></svg>
            </div>
            <div>
                <h1 class="title" id="title">Welcome back!</h1>
                <p class="subtitle">Sign in to continue:</p>
            </div>
        </div>

        <div class="guest-login-container">
            <!-- Google Log In Button -->
            <button id="google-login-btn" class="google-login-btn" onclick="startGoogleAuth()">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/>
                </svg>
                Log in with Google
            </button>
            
            <button id="guest-login-btn" class="guest-login-btn" onclick="handleGuestLogin()">
                <svg class="guest-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                Log in as guest
            </button>
        </div>

        <div class="divider">
            <span>or</span>
        </div>

        <form action="home.html" method="get" novalidate>
            <div class="field">
                <label for="identity">Username or email</label>
                <input class="input" id="identity" name="identity" type="email" placeholder="Username or Email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input class="input" id="password" name="password" type="password" placeholder="Password" required>
            </div>

            <div class="row">
                <span class="muted">Don't have an account? <a class="link" href="register.html">Register</a></span>
            </div>

            <button class="submit" type="submit">Log in</button>
        </form>
    </div>

    <p class="footer-text"><a class="link" href="index.html">← Back</a></p>

    <script>
        // GOOGLE CLIENT ID: Using your provided Client ID
        const GOOGLE_CLIENT_ID = '95681207533-391rcrdh6926ohoonspkguce4rlkfkg3.apps.googleusercontent.com';
        let tokenClient;

        function handleGuestLogin() {
            // Redirect to home page with guest identity
            window.location.href = 'home.html?identity=Guest&auth=guest';
        }

        // Initialize the Token Client when the library loads
        window.onload = function() {
            // LOG ORIGIN FOR DEBUGGING
            console.log('Current Origin:', window.location.origin);
            
            // CHECK FOR FILE SYSTEM: Google Auth will NOT work from file://
            if (window.location.protocol === 'file:') {
                console.warn('Google Sign-In will not work when opening the file directly (file:// protocol). Please use a local server (like Live Server in VS Code).');
            }

            if (typeof google !== 'undefined') {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'openid profile email', 
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            fetchUserInfo(tokenResponse.access_token);
                        }
                    },
                    error_callback: (err) => {
                        console.error('Token Client Error:', err);
                        alert(`Google Sign-In Error: ${err.message}\n\nMake sure your origin (${window.location.origin}) is whitelisted in Google Console.`);
                    }
                });
            } else {
                console.error('Google library (gsi/client) not loaded.');
            }
        };

        function startGoogleAuth() {
            if (window.location.protocol === 'file:') {
                alert('ERROR: Google Sign-In does not work on "file://" URLs.\n\nYou MUST use a local server (http:// or https://).');
                return;
            }

            if (typeof google === 'undefined' || !tokenClient) {
                alert('Google Sign-In is still loading. Please wait or check your internet connection.');
                return;
            }
            
            console.log('Starting Google Auth with Origin:', window.location.origin);
            
            // Request the access token
            tokenClient.requestAccessToken({ 
                prompt: 'select_account', // Changed from consent to select_account for better UX
                hint: '' // Optional login hint
            });
        }

        async function fetchUserInfo(accessToken) {
            try {
                // Fetch user profile information from Google's UserInfo endpoint
                const response = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                const userData = await response.json();
                
                if (userData && userData.name) {
                    const name = userData.name;
                    const email = userData.email || '';
                    
                    // Redirect to home page with Google identity and email
                    window.location.href = `home.html?identity=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&auth=google`;
                } else {
                    throw new Error('Could not retrieve user data');
                }
            } catch (error) {
                console.error('Error fetching user info:', error);
                alert('Failed to get user information from Google. Please try again.');
            }
        }

        // Keep this for potential future use or other token types
        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }
        (function(){
            try{
                var params = new URLSearchParams(window.location.search);
                if(params.get('logged_out') === '1'){
                    toastr.info('You have been signed out of your session.', 'Successfully logged out!', {
                        timeOut: 4000,
                        extendedTimeOut: 1500,
                        closeButton: true,
                        progressBar: true,
                        positionClass: 'toast-top-right'
                    });
                }
            } catch(e) { /* noop */ }
        })();
    </script>
</body>
</html>
