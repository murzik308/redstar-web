<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Log in · RedStar Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <style>
        .guest-login-container {
            text-align: center;
            margin: 20px 0;
        }
        
        .guest-login-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        
        .guest-login-btn:hover {
            background: #4b5563;
        }
        
        .guest-icon {
            width: 18px;
            height: 18px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--muted);
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .divider span {
            padding: 0 16px;
        }
    </style>
</head>
<body>
    <div class="card" role="region" aria-labelledby="title">
        <div class="header">
            <div class="logo" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#e11d48" d="M12 2l2.6 5.28L20 8.18l-4.1 3.92L16.5 18 12 15.27 7.5 18l.6-5.9L4 8.18l5.4-.9z"/></svg>
            </div>
            <div>
                <h1 class="title" id="title">Welcome back!</h1>
                <p class="subtitle">Sign in to continue:</p>
            </div>
        </div>

        <div class="guest-login-container">
            <button id="guest-login-btn" class="guest-login-btn" onclick="handleGuestLogin()">
                <svg class="guest-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                Log in as guest
            </button>
        </div>

        <div class="divider">
            <span>or</span>
        </div>

        <form action="home.html" method="get" novalidate>
            <div class="field">
                <label for="identity">Username or email</label>
                <input class="input" id="identity" name="identity" type="email" placeholder="Username or Email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input class="input" id="password" name="password" type="password" placeholder="Password" required>
            </div>

            <div class="row">
                <span class="muted">Don't have an account? <a class="link" href="register.html">Register</a></span>
            </div>

            <button class="submit" type="submit">Log in</button>
        </form>
    </div>

    <p class="footer-text"><a class="link" href="index.html">← Back</a></p>

    <script>
        function handleGuestLogin() {
            // Redirect to home page with guest identity
            window.location.href = 'home.html?identity=Guest&auth=guest';
        }
        (function(){
            try{
                var params = new URLSearchParams(window.location.search);
                if(params.get('logged_out') === '1'){
                    toastr.info('You have been signed out of your session.', 'Successfully logged out!', {
                        timeOut: 4000,
                        extendedTimeOut: 1500,
                        closeButton: true,
                        progressBar: true,
                        positionClass: 'toast-top-right'
                    });
                }
            } catch(e) { /* noop */ }
        })();
    </script>
</body>
</html>
