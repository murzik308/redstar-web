<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Register · RedStar Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="card" role="region" aria-labelledby="title">
        <div class="header">
            <div class="logo" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#e11d48" d="M12 2l2.6 5.28L20 8.18l-4.1 3.92L16.5 18 12 15.27 7.5 18l.6-5.9L4 8.18l5.4-.9z"/></svg>
            </div>
            <div>
                <h1 class="title" id="title">Create your account</h1>
                <p class="subtitle">Join the RedStar Club</p>
            </div>
        </div>

        <form action="#" method="post" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input class="input" id="username" name="username" type="text" placeholder="Username" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input class="input" id="email" name="email" type="email" placeholder="Email" required>
            </div>
            <div class="field">
                <label for="reg-password">Password</label>
                <input class="input" id="reg-password" name="password" type="password" placeholder="Password" required>
            </div>

            <div class="field">
                <label for="captcha">Captcha</label>
                <div class="captcha" id="captcha">
                    <input type="checkbox" id="captcha-check" aria-label="I am not a robot">
                    <label for="captcha-check" class="muted">I'm not a robot</label>
                </div>
            </div>

            <button class="submit" type="submit"><a href="login.html">Register</a></button>
        </form>
    </div>

    <p class="footer-text">Already have an account? <a class="link" href="login.html">Log in</a></p>
    <p class="footer-text"><a class="link" href="index.html">← Back to home</a></p>
</body>
</html>
